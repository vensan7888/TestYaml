
openapi: 3.0.3
info:
  title: User Service API
  description: API for user authentication and profile management00
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Local development server

paths:
  /fetchcatalog:
    post:
      summary: Fetch Product catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
components:
  schemas:
    CatalogRequest:
      type: object
      properties:
        currentPage:
          type: integer
    CatalogResponse:
      type: object
      properties:
        hasMore:
          type: boolean
        products:
          type: array
          properties:
            id:
              type: integer
            imageUrl:
              type: string
            title:
              type: string
            description:
              type: string
            inStock:
              type: boolean
            rating:
              type: number
            price:
              type: number
            currency:
              type: string
